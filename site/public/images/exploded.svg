<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 820" role="img" aria-labelledby="t d">
  <title id="t">Exploded AquaSense buoy — BOB float, Pelican deck, five sensors</title>
  <desc id="d">Layers from the BOM: 10 W panel on the Pelican lid, Pelican 1120, 24 in PVC square plus three inner tubes, cage with exactly five sensors, mooring eye. Not a solid foam hull. Not six probes.</desc>
  <rect width="900" height="820" fill="#07151C"/>
  <text x="40" y="40" fill="#E6D5B8" font-family="Georgia, serif" font-size="22">Exploded buoy — parts count</text>
  <text x="40" y="62" fill="#8BA8A6" font-family="ui-sans-serif, system-ui" font-size="12">SECOORA Levin BOB float (24 in square of 4 in Sch40). Deck is a Pelican 1120, not the Pasco pegboard mast.</text>

  <!-- solar -->
  <rect x="330" y="78" width="200" height="36" rx="3" fill="#1FA6A0"/>
  <text x="348" y="101" fill="#07151C" font-family="ui-sans-serif, system-ui" font-size="13">10 W 6 V solar on the LID</text>
  <text x="550" y="100" fill="#8BA8A6" font-family="ui-sans-serif, system-ui" font-size="12">Voltaic P110 · not under the box</text>
  <line x1="430" y1="114" x2="430" y2="128" stroke="#8BA8A6"/>

  <!-- pelican -->
  <rect x="300" y="128" width="260" height="88" rx="8" fill="#0C1F28" stroke="#E6D5B8"/>
  <text x="318" y="154" fill="#F4F1EA" font-family="ui-sans-serif, system-ui" font-size="14">Pelican 1120 (black, yellow latches)</text>
  <text x="318" y="176" fill="#8BA8A6" font-family="ui-sans-serif, system-ui" font-size="12">T-A7670G · 18650 · microSD · terminals</text>
  <text x="318" y="196" fill="#8BA8A6" font-family="ui-sans-serif, system-ui" font-size="12">PG glands on the BOTTOM face only</text>
  <text x="580" y="160" fill="#E6D5B8" font-family="ui-sans-serif, system-ui" font-size="12">LTE whip + GPS puck</text>
  <line x1="430" y1="216" x2="430" y2="236" stroke="#8BA8A6"/>

  <!-- pvc square -->
  <rect x="160" y="236" width="540" height="160" rx="12" fill="none" stroke="#F4F1EA" stroke-width="18"/>
  <text x="40" y="270" fill="#F4F1EA" font-family="ui-sans-serif, system-ui" font-size="13">4 in Sch40</text>
  <text x="40" y="288" fill="#F4F1EA" font-family="ui-sans-serif, system-ui" font-size="13">24 in square</text>
  <text x="40" y="306" fill="#8BA8A6" font-family="ui-sans-serif, system-ui" font-size="12">4 × 15 in + 4 elbows</text>
  <rect x="230" y="278" width="400" height="28" rx="10" fill="#E6D5B8"/>
  <rect x="230" y="318" width="400" height="28" rx="10" fill="#E6D5B8"/>
  <rect x="230" y="358" width="400" height="28" rx="10" fill="#E6D5B8"/>
  <text x="250" y="297" fill="#07151C" font-family="ui-sans-serif, system-ui" font-size="12">three 15 in inner tubes · 6 caps</text>
  <text x="720" y="300" fill="#E6D5B8" font-family="ui-sans-serif, system-ui" font-size="12">yellow/white tape</text>
  <line x1="430" y1="396" x2="430" y2="430" stroke="#8BA8A6"/>

  <!-- cage + 5 sensors -->
  <rect x="280" y="430" width="300" height="210" rx="8" fill="#0C1F28" stroke="#1FA6A0"/>
  <text x="300" y="454" fill="#1FA6A0" font-family="ui-sans-serif, system-ui" font-size="13">sensor cage — exactly five</text>
  <g font-family="ui-sans-serif, system-ui" font-size="12">
    <rect x="310" y="470" width="16" height="90" rx="3" fill="#1FA6A0"/>
    <text x="334" y="490" fill="#1FA6A0">pH SEN0169-V2</text>
    <rect x="310" y="470" width="16" height="90" rx="3" fill="#1FA6A0" transform="translate(0,0)"/>
    <rect x="370" y="470" width="16" height="90" rx="3" fill="#E6D5B8"/>
    <text x="394" y="490" fill="#E6D5B8">EC DFR0300-H</text>
    <rect x="430" y="470" width="16" height="90" rx="3" fill="#C4452D"/>
    <text x="454" y="490" fill="#C4452D">DO SEN0237-A</text>
    <rect x="310" y="575" width="8" height="50" rx="2" fill="#F4F1EA"/>
    <text x="326" y="600" fill="#F4F1EA">DS18B20 thin probe</text>
    <rect x="430" y="585" width="28" height="18" rx="2" fill="#7EB6D9"/>
    <text x="464" y="598" fill="#7EB6D9">MS5803 small breakout</text>
  </g>
  <line x1="430" y1="640" x2="430" y2="680" stroke="#C4452D" stroke-width="3"/>
  <text x="448" y="700" fill="#C4452D" font-family="ui-sans-serif, system-ui" font-size="13">mooring eye (one corner)</text>

  <text x="40" y="760" fill="#8BA8A6" font-family="ui-sans-serif, system-ui" font-size="12">We use Levin’s PVC square and inner tubes. We do not copy the Pasco pegboard mast or four-sensor Pasco cage.</text>
  <text x="40" y="780" fill="#8BA8A6" font-family="ui-sans-serif, system-ui" font-size="12">Yellow/white hull only — not a channel marker. Source: SECOORA BOB Build Manual (Levin, 2010).</text>
</svg>
