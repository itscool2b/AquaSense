services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aquasense
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aquasense}
      POSTGRES_DB: aquasense
    volumes:
      - ./data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aquasense -d aquasense"]
      interval: 3s
      timeout: 5s
      retries: 20

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://aquasense:${POSTGRES_PASSWORD:-aquasense}@db:5432/aquasense
      INGEST_TOKEN: ${INGEST_TOKEN:-change-me}
      WEB_DIR: /app/web
    depends_on:
      db:
        condition: service_healthy
