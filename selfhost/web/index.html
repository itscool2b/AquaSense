<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AquaSense — your buoy</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="wrap">
      <p class="kicker">Self-hosted · not GitHub Pages</p>
      <h1>AquaSense</h1>
      <p class="lede">
        A solar buoy that sits on the water, measures a few stats, uses cellular
        internet to send them to a website you host.
      </p>
      <p id="status" class="muted">Waiting for the first POST…</p>
      <div id="gauges" class="gauges"></div>
      <div class="chart-head">
        <h2>Charts</h2>
        <div class="seg">
          <button type="button" data-range="24h" class="on">24h</button>
          <button type="button" data-range="7d">7d</button>
        </div>
      </div>
      <p class="muted">Dashed rust line on DO is 2 mg/L hypoxia (ecological rule of thumb, not an FDEP lab limit).</p>
      <div class="chart-grid" id="charts"></div>
      <h2>Map</h2>
      <div id="mapwrap"></div>
    </div>
    <script src="/static/dashboard.js"></script>
  </body>
</html>
