<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AquaSense dashboard</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="wrap">
      <p class="kicker">AquaSense · water monitor</p>
      <h1>Water status</h1>
      <p id="status" class="muted">Loading…</p>

      <div id="alerts"></div>
      <div id="tiles" class="tiles"></div>

      <div class="controls" role="group" aria-label="Time range">
        <button type="button" data-range="1h">1 hour</button>
        <button type="button" data-range="24h" class="on">24 hours</button>
        <button type="button" data-range="7d">7 days</button>
        <button type="button" data-range="30d">30 days</button>
      </div>
      <div id="charts" class="charts"></div>
      <p class="muted small">Shaded band = target range (set in <code>selfhost/.env</code>). Hover a chart for exact values.</p>
    </div>
    <script src="/static/dashboard.js"></script>
  </body>
</html>
