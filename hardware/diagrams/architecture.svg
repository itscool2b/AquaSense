<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="t">
  <title id="t">AquaSense architecture</title>
  <rect width="720" height="280" fill="#07151C"/>
  <text x="24" y="32" fill="#E6D5B8" font-family="Georgia, serif" font-size="18">Your buoy ’ your website</text>

  <rect x="24" y="56" width="220" height="180" rx="12" fill="#0C1F28" stroke="#1FA6A0"/>
  <text x="40" y="84" fill="#1FA6A0" font-family="ui-sans-serif, system-ui" font-size="12">YOUR BUOY</text>
  <text x="40" y="112" fill="#F4F1EA" font-family="ui-sans-serif, system-ui" font-size="13">10 W solar + 18650</text>
  <text x="40" y="134" fill="#F4F1EA" font-family="ui-sans-serif, system-ui" font-size="13">T-A7670G LTE + GPS</text>
  <text x="40" y="156" fill="#F4F1EA" font-family="ui-sans-serif, system-ui" font-size="13">pH · EC · DO · temp · depth</text>
  <text x="40" y="188" fill="#8BA8A6" font-family="ui-sans-serif, system-ui" font-size="12">Sleep 15 min · CSV on SD</text>
  <text x="40" y="210" fill="#8BA8A6" font-family="ui-sans-serif, system-ui" font-size="12">HTTPS POST ingest_url</text>

  <polygon points="258,146 292,132 292,160" fill="#1FA6A0"/>

  <rect x="300" y="56" width="180" height="180" rx="12" fill="#0C1F28" stroke="#E6D5B8"/>
  <text x="316" y="84" fill="#E6D5B8" font-family="ui-sans-serif, system-ui" font-size="12">YOUR INGEST</text>
  <text x="316" y="122" fill="#F4F1EA" font-family="ui-sans-serif, system-ui" font-size="13">docker compose up</text>
  <text x="316" y="144" fill="#F4F1EA" font-family="ui-sans-serif, system-ui" font-size="13">POST /api/v1/ingest</text>
  <text x="316" y="176" fill="#8BA8A6" font-family="ui-sans-serif, system-ui" font-size="12">Postgres on your machine</text>
  <text x="316" y="198" fill="#8BA8A6" font-family="ui-sans-serif, system-ui" font-size="12">We host nothing</text>

  <polygon points="494,146 528,132 528,160" fill="#1FA6A0"/>

  <rect x="536" y="56" width="160" height="180" rx="12" fill="#0C1F28" stroke="#F4F1EA"/>
  <text x="552" y="84" fill="#F4F1EA" font-family="ui-sans-serif, system-ui" font-size="12">YOUR DASHBOARD</text>
  <text x="552" y="122" fill="#F4F1EA" font-family="ui-sans-serif, system-ui" font-size="13">Gauges · 24h charts</text>
  <text x="552" y="144" fill="#F4F1EA" font-family="ui-sans-serif, system-ui" font-size="13">Map · last-seen</text>
  <text x="552" y="176" fill="#8BA8A6" font-family="ui-sans-serif, system-ui" font-size="12">localhost:8080</text>
