name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Filter tests
        run: make -C firmware test
      - name: Install PlatformIO
        run: pip install platformio
      - name: Compile firmware
        working-directory: firmware
        run: pio run
      - name: Compile layer sketches
        working-directory: firmware
        run: |
          for d in examples/*/; do
            pio ci "$d" --project-conf platformio.ini
          done

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Alert rule tests
        working-directory: selfhost
        run: |
          pip install -r api/requirements.txt pytest
          python -m pytest
      - name: Start server
        working-directory: selfhost
        run: docker compose up -d --build
      - name: Post test data and read it back
        run: |
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:8080/api/v1/health && break
            sleep 2
          done
          COUNT=30 python3 scripts/simulate-device.py
          curl -sf http://127.0.0.1:8080/api/v1/latest | grep sim-pool
          curl -sf "http://127.0.0.1:8080/api/v1/measurements?range=1h" | grep '"ph"'
